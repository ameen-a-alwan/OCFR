worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    # Upstream: FastAPI (uvicorn)
    upstream ocfr_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    # Upstream: Next.js
    upstream ocfr_web {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # All backend routes: https://domain/api/...
        # Strip the /api prefix so FastAPI keeps its existing paths (/tasks, /auth, /v3, …)
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://ocfr_api/;
        }

        # Exact /api → health-style redirect to /api/
        location = /api {
            return 302 /api/;
        }

        # Frontend (Next.js)
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_pass http://ocfr_web;
        }
    }
}
